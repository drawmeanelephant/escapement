name: Attach custom domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Custom domain to attach to the escapement-asw Pages project"
        required: true
        default: "escapement.filed.fyi"

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip until secrets are configured
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets not configured yet — skipping."

      - name: Diagnose and attach domain via Cloudflare API
        if: env.HAS_CF_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set +e
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          echo "=== Pages projects in account ==="
          curl -sS "${API}/projects?per_page=20" -H "$AUTH" \
            | jq -r '.result[]? | "\(.name) -> \(.subdomain)"'

          echo "=== Domain map (which project claims ${DOMAIN}) ==="
          for p in $(curl -sS "${API}/projects?per_page=20" -H "$AUTH" | jq -r '.result[]?.name'); do
            echo "-- project: ${p}"
            curl -sS "${API}/projects/${p}/domains" -H "$AUTH" \
              | jq -r '.result[]? | "   domain: \(.name)  status: \(.status)"'
          done

          echo "=== Attach ${DOMAIN} to escapement-asw ==="
          curl -sS -X POST "${API}/projects/escapement-asw/domains" \
            -H "$AUTH" -H "Content-Type: application/json" \
            --data "{\"name\": \"${DOMAIN}\"}"
          echo
