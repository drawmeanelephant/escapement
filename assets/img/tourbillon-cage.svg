<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Georgia, 'Times New Roman', serif">
  <title>The tourbillon cage: escapement rotating inside a carriage</title>

  <text x="320" y="36" text-anchor="middle" font-size="24" fill="#1f2933" font-style="italic">The tourbillon cage</text>
  <text x="320" y="60" text-anchor="middle" font-size="13" fill="#7a4f2b">the whole escapement rotates once per minute, averaging position error</text>

  <!-- rotation arrow -->
  <path d="M320 100 a150 150 0 1 1 -60 -22" fill="none" stroke="#7a4f2b" stroke-width="3" marker-end="url(#a4)"/>

  <!-- cage -->
  <g stroke="#1f2933" stroke-width="3.5" fill="none">
    <circle cx="320" cy="270" r="150"/>
    <circle cx="320" cy="270" r="140"/>
    <!-- cage bars -->
    <line x1="320" y1="120" x2="320" y2="420"/>
    <line x1="170" y1="270" x2="470" y2="270"/>
    <circle cx="320" cy="270" r="12" fill="#1f2933"/>
  </g>

  <!-- escape wheel inside (lower half) -->
  <g stroke="#7a4f2b" stroke-width="3" fill="none">
    <circle cx="320" cy="352" r="34"/>
    <circle cx="320" cy="352" r="6"/>
    <g fill="#7a4f2b" stroke="none" transform="translate(320,352)">
      <g><path d="M0 -34 L9 -50 L16 -42 L5 -30 Z"/></g>
      <g transform="rotate(45)"><path d="M0 -34 L9 -50 L16 -42 L5 -30 Z"/></g>
      <g transform="rotate(90)"><path d="M0 -34 L9 -50 L16 -42 L5 -30 Z"/></g>
      <g transform="rotate(135)"><path d="M0 -34 L9 -50 L16 -42 L5 -30 Z"/></g>
      <g transform="rotate(180)"><path d="M0 -34 L9 -50 L16 -42 L5 -30 Z"/></g>
      <g transform="rotate(225)"><path d="M0 -34 L9 -50 L16 -42 L5 -30 Z"/></g>
      <g transform="rotate(270)"><path d="M0 -34 L9 -50 L16 -42 L5 -30 Z"/></g>
      <g transform="rotate(315)"><path d="M0 -34 L9 -50 L16 -42 L5 -30 Z"/></g>
    </g>
  </g>

  <!-- balance inside (upper half) -->
  <g stroke="#1f2933" stroke-width="3" fill="none">
    <circle cx="320" cy="192" r="52"/>
    <circle cx="320" cy="192" r="42"/>
    <circle cx="320" cy="192" r="8" fill="#1f2933"/>
    <line x1="320" y1="150" x2="320" y2="234"/>
    <line x1="278" y1="192" x2="362" y2="192"/>
    <line x1="290" y1="162" x2="350" y2="222"/>
    <line x1="290" y1="222" x2="350" y2="162"/>
  </g>
  <!-- hairspring hint -->
  <path d="M320 192 C 330 182 344 188 342 202 C 340 218 320 222 308 210 C 292 194 300 172 318 168"
        fill="none" stroke="#7a4f2b" stroke-width="2"/>

  <!-- labels -->
  <g font-size="15" fill="#1f2933">
    <text x="482" y="196">balance &amp; spring</text>
    <text x="482" y="356">escape wheel</text>
    <text x="320" y="444" text-anchor="middle" font-size="13" fill="#7a4f2b">cage bars carry the whole escapement; the pivot is the cage axis</text>
  </g>
  <path d="M472 190 L376 188" stroke="#7a4f2b" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M472 350 L358 350" stroke="#7a4f2b" stroke-width="1.5" marker-end="url(#a4)"/>

  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a4f2b"/>
    </marker>
  </defs>
</svg>
