<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Georgia, 'Times New Roman', serif">
  <title>The going train: barrel to escape wheel</title>
  <!-- ground line -->
  <line x1="40" y1="300" x2="880" y2="300" stroke="#b08968" stroke-width="2"/>

  <!-- barrel -->
  <g stroke="#1f2933" stroke-width="3" fill="none">
    <circle cx="120" cy="170" r="80"/>
    <circle cx="120" cy="170" r="14"/>
    <path d="M120 170 m-52 0 a52 52 0 1 1 104 0 a52 52 0 1 1 -104 0" stroke="#7a4f2b" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M120 170 m-34 0 a34 34 0 1 1 68 0 a34 34 0 1 1 -68 0" stroke="#7a4f2b" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M120 170 m-18 0 a18 18 0 1 1 36 0 a18 18 0 1 1 -36 0" stroke="#7a4f2b" stroke-width="1.5" stroke-dasharray="3 5"/>
  </g>
  <text x="120" y="272" text-anchor="middle" font-size="19" fill="#1f2933">barrel</text>
  <text x="120" y="292" text-anchor="middle" font-size="13" fill="#7a4f2b">mainspring inside · 1 rev / 6–8 h</text>

  <!-- center wheel -->
  <g stroke="#1f2933" stroke-width="3" fill="none">
    <circle cx="320" cy="170" r="58"/>
    <circle cx="320" cy="170" r="10"/>
    <line x1="320" y1="112" x2="320" y2="228"/>
    <line x1="262" y1="170" x2="378" y2="170"/>
    <line x1="279" y1="129" x2="361" y2="211"/>
    <line x1="279" y1="211" x2="361" y2="129"/>
  </g>
  <text x="320" y="272" text-anchor="middle" font-size="19" fill="#1f2933">center wheel</text>
  <text x="320" y="292" text-anchor="middle" font-size="13" fill="#7a4f2b">1 rev / hour → minute hand</text>

  <!-- third wheel -->
  <g stroke="#1f2933" stroke-width="3" fill="none">
    <circle cx="490" cy="170" r="46"/>
    <circle cx="490" cy="170" r="9"/>
    <line x1="490" y1="124" x2="490" y2="216"/>
    <line x1="444" y1="170" x2="536" y2="170"/>
    <line x1="458" y1="138" x2="522" y2="202"/>
    <line x1="458" y1="202" x2="522" y2="138"/>
  </g>
  <text x="490" y="272" text-anchor="middle" font-size="19" fill="#1f2933">third wheel</text>
  <text x="490" y="292" text-anchor="middle" font-size="13" fill="#7a4f2b">ratio only</text>

  <!-- fourth wheel -->
  <g stroke="#1f2933" stroke-width="3" fill="none">
    <circle cx="640" cy="170" r="40"/>
    <circle cx="640" cy="170" r="8"/>
    <line x1="640" y1="130" x2="640" y2="210"/>
    <line x1="600" y1="170" x2="680" y2="170"/>
    <line x1="612" y1="142" x2="668" y2="198"/>
    <line x1="612" y1="198" x2="668" y2="142"/>
  </g>
  <text x="640" y="272" text-anchor="middle" font-size="19" fill="#1f2933">fourth wheel</text>
  <text x="640" y="292" text-anchor="middle" font-size="13" fill="#7a4f2b">1 rev / minute → seconds hand</text>

  <!-- escape wheel -->
  <g stroke="#1f2933" stroke-width="3" fill="none">
    <circle cx="795" cy="170" r="34"/>
    <circle cx="795" cy="170" r="7"/>
  </g>
  <!-- club teeth around escape wheel -->
  <g fill="#7a4f2b" stroke="#7a4f2b" stroke-width="1.5">
    <g transform="translate(795,170)">
      <g><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(30)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(60)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(90)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(120)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(150)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(180)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(210)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(240)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(270)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(300)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
      <g transform="rotate(330)"><path d="M0 -34 L10 -52 L18 -44 L6 -30 Z"/></g>
    </g>
  </g>
  <text x="795" y="272" text-anchor="middle" font-size="19" fill="#1f2933">escape wheel</text>
  <text x="795" y="292" text-anchor="middle" font-size="13" fill="#7a4f2b">15 club teeth → escapement</text>

  <!-- mesh arrows -->
  <g stroke="#7a4f2b" stroke-width="2" fill="#7a4f2b">
    <line x1="200" y1="170" x2="258" y2="170" marker-end="url(#arrow)"/>
    <line x1="378" y1="170" x2="442" y2="170" marker-end="url(#arrow)"/>
    <line x1="536" y1="170" x2="598" y2="170" marker-end="url(#arrow)"/>
    <line x1="680" y1="170" x2="757" y2="170" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a4f2b"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" font-size="24" fill="#1f2933" font-style="italic">The going train</text>
  <text x="460" y="62" text-anchor="middle" font-size="14" fill="#7a4f2b">energy flows left to right; rotation slows as torque is diluted</text>
</svg>
